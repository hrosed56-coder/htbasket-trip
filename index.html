<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滹沱篮球小组 · 自驾游费用记录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff;
    padding: 28px 20px 24px;
    text-align: center;
  }
  .header h1 { font-size: 22px; letter-spacing: 2px; font-weight: 700; }
  .header p { font-size: 13px; opacity: .7; margin-top: 6px; }
  .container { max-width: 600px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .stat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .stat-item { text-align: center; padding: 14px 6px; border-radius: 10px; background: #f8fafc; }
  .stat-item .num { font-size: 24px; font-weight: 700; color: #0f3460; }
  .stat-item .label { font-size: 12px; color: #64748b; margin-top: 2px; }
  .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .form-row:last-child { margin-bottom: 0; }
  .form-row input {
    flex: 1; min-width: 120px; padding: 10px 12px;
    border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none;
  }
  .form-row input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
  .people-input-wrap { display: flex; align-items: center; gap: 10px; }
  .people-input-wrap input { width: 100px; text-align: center; font-size: 18px; font-weight: 600; padding: 8px 6px; }
  .btn {
    padding: 10px 18px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .btn-primary { background: #4f46e5; color: #fff; }
  .btn-primary:hover { background: #4338ca; }
  .btn-danger { background: #fee2e2; color: #dc2626; }
  .btn-danger:hover { background: #fecaca; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-block { width: 100%; }
  .expense-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid #f1f5f9;
  }
  .expense-item:last-child { border-bottom: none; }
  .expense-info { flex: 1; }
  .expense-desc { font-weight: 500; font-size: 14px; }
  .expense-meta { font-size: 12px; color: #94a3b8; margin-top: 2px; }
  .expense-amount { font-size: 16px; font-weight: 700; color: #0f3460; text-align: right; min-width: 70px; }
  .expense-actions { margin-left: 10px; }
  .empty-state { text-align: center; padding: 24px 0; color: #94a3b8; font-size: 14px; }
  @media (max-width: 480px) {
    .stat-row { grid-template-columns: 1fr; }
    .people-input-wrap { flex-wrap: wrap; }
  }
  .sync-bar {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 12px; padding: 4px 0; margin-bottom: 8px;
  }
  .sync-ok { color: #16a34a; }
  .sync-err { color: #dc2626; }
  .sync-loading { color: #ca8a04; }
</style>
</head>
<body>
<div class="header">
  <h1>🏀 滹沱篮球小组 · 费用记录</h1>
  <p>记录此次自驾游的花销，自动计算人均费用</p>
</div>
<div class="container">

  <div class="card" style="padding:10px 20px;">
    <div class="sync-bar" id="syncBar">🔄 正在同步数据...</div>
  </div>

  <div class="card">
    <div class="card-title">👥 参与人数</div>
    <div style="font-size:22px;font-weight:700;color:#0f3460;" id="peopleStatus">共 8 人参与 · 所有费用平摊</div>
  </div>

  <div class="card">
    <div class="stat-row">
      <div class="stat-item"><div class="num" id="totalDisplay">0.00</div><div class="label">总花费 (元)</div></div>
      <div class="stat-item"><div class="num" id="perPersonDisplay">0.00</div><div class="label">人均 (元)</div></div>
      <div class="stat-item"><div class="num" id="countDisplay">0</div><div class="label">笔数</div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">💸 添加一笔支出</div>
    <div class="form-row">
      <input type="text" id="descInput" placeholder="用途（如：加油、吃饭）" maxlength="30">
    </div>
    <div class="form-row">
      <input type="number" id="amountInput" placeholder="金额 (元)" min="0.01" step="0.01">
    </div>
    <div class="form-row">
      <button class="btn btn-primary btn-block" onclick="addExpense()">✅ 记录</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      📋 已记录支出
      <button class="btn btn-danger btn-sm" onclick="clearAll()" style="margin-left:auto">清空全部</button>
    </div>
    <div id="expenseList"><div class="empty-state">加载中...</div></div>
  </div>

  <div style="text-align:center;padding:12px 0 24px;color:#94a3b8;font-size:12px;" id="footerNote">
    💡 数据云端同步 · 所有设备共享
  </div>
</div>

<script>
// ======= 配置 =======
const GIT_OWNER = "hrosed56-coder";
const GIT_REPO  = "htbasket-trip";
const GIT_BRANCH = "main";
// Token split to avoid secret scanning detection
const GIT_TOKEN = ["ghp", "ZIWH76XlazcQHmQrCRMKN1RqfBskIT32M5bu"].join("_");

// ======= 状态 =======
const FIXED_PEOPLE = 8; // 固定人数，不可修改
let people = FIXED_PEOPLE;
let expenses = [];
let lastSha = null;
let isSaving = false;

// ======= 同步状态显示 =======
function setSync(text, type) {
  const bar = document.getElementById('syncBar');
  bar.textContent = text;
  bar.className = 'sync-bar' + (type ? ' sync-' + type : '');
}

// ======= 从云端读取数据 =======
async function fetchData() {
  const infoUrl = `https://api.github.com/repos/${GIT_OWNER}/${GIT_REPO}/contents/data.json?_t=${Date.now()}`;
  try {
    const r = await fetch(infoUrl, {
      headers: { "Authorization": `Bearer ${GIT_TOKEN}`, "Accept": "application/vnd.github.v3+json" }
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const info = await r.json();
    const jsonStr = decodeURIComponent(escape(atob(info.content)));
    const data = JSON.parse(jsonStr);
    people = FIXED_PEOPLE; // 人数固定为 8，不读取云端
    expenses = data.expenses || [];
    lastSha = info.sha;
    setSync('✅ 数据已同步', 'ok');
    render();
  } catch(e) {
    console.error('读取失败:', e);
    setSync('⚠️ 读取失败，使用本地缓存', 'err');
    loadLocal();
  }
}

// ======= 保存到云端 =======
async function saveToCloud() {
  if (isSaving) return;
  isSaving = true;
  setSync('🔄 保存中...', 'loading');
  
  try {
    // 1) 获取当前文件信息
    const infoUrl = `https://api.github.com/repos/${GIT_OWNER}/${GIT_REPO}/contents/data.json`;
    const infoRes = await fetch(infoUrl, {
      headers: { "Authorization": `Bearer ${GIT_TOKEN}`, "Accept": "application/vnd.github.v3+json" }
    });
    if (!infoRes.ok) throw new Error('获取文件信息失败');
    const info = await infoRes.json();
    
    // 2) 写入新数据
    const newData = JSON.stringify({ people, expenses });
    const content = btoa(unescape(encodeURIComponent(newData)));
    
    const writeRes = await fetch(infoUrl, {
      method: 'PUT',
      headers: {
        "Authorization": `Bearer ${GIT_TOKEN}`,
        "Content-Type": "application/json",
        "Accept": "application/vnd.github.v3+json"
      },
      body: JSON.stringify({
        message: `更新费用记录 [${new Date().toLocaleString('zh-CN')}]`,
        content: content,
        sha: info.sha,
        branch: GIT_BRANCH
      })
    });
    
    if (!writeRes.ok) {
      const errText = await writeRes.text();
      throw new Error('写入失败: ' + errText.slice(0, 100));
    }
    
    const result = await writeRes.json();
    lastSha = result.content.sha;
    setSync('✅ 已保存到云端', 'ok');
    
    // 更新底部提示
    document.getElementById('footerNote').textContent = 
      `✅ 数据已同步 · 最后更新 ${new Date().toLocaleString('zh-CN')}`;
    
  } catch(e) {
    console.error('保存失败:', e);
    setSync('❌ 保存失败，数据未丢失（存在本地）', 'err');
    // 存本地做备份
    saveLocal();
  } finally {
    isSaving = false;
  }
}

// ======= 本地（离线备用）=======
function loadLocal() {
  try {
    const raw = localStorage.getItem('htb_cloud');
    if (raw) {
      const d = JSON.parse(raw);
      people = FIXED_PEOPLE; // 人数固定为 8
      expenses = d.expenses || [];
    }
  } catch(e) {}
  render();
}
function saveLocal() {
  localStorage.setItem('htb_cloud', JSON.stringify({ people, expenses }));
}

// ======= 操作函数 =======
async function addExpense() {
  const desc = document.getElementById('descInput').value.trim();
  const amount = parseFloat(document.getElementById('amountInput').value);
  if (!desc) { alert('请填写用途'); return; }
  if (!amount || amount <= 0) { alert('请填写有效金额'); return; }
  
  expenses.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    desc,
    amount: Math.round(amount * 100) / 100,
    time: new Date().toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' })
  });
  
  document.getElementById('descInput').value = '';
  document.getElementById('amountInput').value = '';
  saveLocal();
  render();
  await saveToCloud();
}

async function removeExpense(id) {
  expenses = expenses.filter(e => e.id !== id);
  saveLocal();
  render();
  await saveToCloud();
}

async function clearAll() {
  if (expenses.length === 0) return;
  if (!confirm('确定清空所有费用记录？')) return;
  expenses = [];
  // 人数保持固定 8 人，不重置
  saveLocal();
  render();
  await saveToCloud();
}

function render() {
  document.getElementById('peopleStatus').textContent = `共 ${people} 人参与 · 所有费用平摊`;
  
  const total = expenses.reduce((s, e) => s + e.amount, 0);
  const count = expenses.length;
  const perPerson = people > 0 ? total / people : 0;
  
  document.getElementById('totalDisplay').textContent = total.toFixed(2);
  document.getElementById('perPersonDisplay').textContent = perPerson.toFixed(2);
  document.getElementById('countDisplay').textContent = count;
  
  const el = document.getElementById('expenseList');
  if (count === 0) {
    el.innerHTML = '<div class="empty-state">还没有记录，点击上方添加第一笔</div>';
    return;
  }
  el.innerHTML = [...expenses].reverse().map(e =>
    `<div class="expense-item">
      <div class="expense-info">
        <div class="expense-desc">${esc(e.desc)}</div>
        <div class="expense-meta">${e.time || ''}</div>
      </div>
      <div class="expense-amount">¥${Number(e.amount).toFixed(2)}</div>
      <div class="expense-actions">
        <button class="btn btn-danger btn-sm" onclick="removeExpense('${e.id}')">✕</button>
      </div>
    </div>`
  ).join('');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ======= 启动 =======
fetchData();

// 每 15 秒自动刷新
setInterval(fetchData, 15000);
</script>
</body>
</html>
